<svg class="board-overlay" viewBox="0 0 1000 750" preserveAspectRatio="none" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="board-pin-cap" cx="29%" cy="20%" r="85%"><stop offset="0" stop-color="#fff6a4"/><stop offset=".19" stop-color="#ffe268"/><stop offset=".58" stop-color="#f5ce2f"/><stop offset=".86" stop-color="#d9af20"/><stop offset="1" stop-color="#aa8417"/></radialGradient>
    <linearGradient id="board-pin-neck"><stop stop-color="#a58b20"/><stop offset=".3" stop-color="#e3bc29"/><stop offset=".47" stop-color="#ffe677"/><stop offset=".7" stop-color="#d8ae22"/><stop offset="1" stop-color="#ad8b1a"/></linearGradient>
    <linearGradient id="board-pin-foot" x2="0" y2="1"><stop stop-color="#ffdd45"/><stop offset=".65" stop-color="#dba20b"/><stop offset="1" stop-color="#865604"/></linearGradient>
    <linearGradient id="board-pin-steel"><stop stop-color="#524f43"/><stop offset=".48" stop-color="#e8e8d4"/><stop offset=".65" stop-color="#929384"/><stop offset="1" stop-color="#3f413b"/></linearGradient>
    <filter id="board-pin-shadow" x="-80%" y="-180%" width="300%" height="500%"><feGaussianBlur stdDeviation="1.3"/></filter>
    <filter id="board-thread-shadow" x="-10%" y="-20%" width="130%" height="150%"><feGaussianBlur stdDeviation=".8"/></filter>
    <g id="board-pushpin">
      <ellipse cx="4.8" cy="4.5" rx="10.2" ry="4.1" fill="#34200a" opacity=".3" transform="rotate(22 4.8 4.5)" filter="url(#board-pin-shadow)"/>
      <path d="M0 -1 1.6 4.6" stroke="url(#board-pin-steel)" stroke-width="1.4" stroke-linecap="round"/>
      <ellipse cx=".7" cy=".7" rx="6.1" ry="2.5" fill="#4a310b" opacity=".23"/>
      <ellipse cy="-1.8" rx="6.1" ry="3.2" fill="url(#board-pin-foot)" stroke="#8e6207" stroke-width=".4"/>
      <ellipse cy="-2.6" rx="5.2" ry="2.2" fill="#eeb71b"/>
      <path d="M-3.7 -11C-1.6 -8.2-1.6 -6.1-4.4 -3.2C-2.4 -1.1 2.7 -1.1 4.9 -3.2C1.7 -6.1 1.5 -8.3 3.5 -11Z" fill="url(#board-pin-neck)" stroke="#c08a0c" stroke-width=".35"/>
      <path d="M-4.6 -3.4C-2.5 -1.2 2.5 -.8 4.5 -2.9" fill="none" stroke="#9c7b15" stroke-width="1.8" stroke-linecap="round"/>
      <path d="M-4.6 -3.65C-2.5 -1.45 2.5 -1.05 4.5 -3.15" fill="none" stroke="#ecd150" stroke-width="1.05" stroke-linecap="round"/>
      <path d="M-7.5 -13.3V-10.2C-7.5 -5.6 7.5 -5.6 7.5 -10.2V-13.3Z" fill="url(#board-pin-neck)" stroke="#b39621" stroke-width=".35"/>
      <ellipse cy="-13.3" rx="7.5" ry="3.65" fill="url(#board-pin-cap)" stroke="#c9ab32" stroke-width=".4"/>
      <path d="M-5.2 -14.5C-3.5 -16-.7 -16.1 1.1 -15.6" fill="none" stroke="#fff7b7" stroke-width=".6" stroke-linecap="round" opacity=".65"/>
    </g>
  </defs>
  <g class="thread-shadow" transform="translate(1.4 2.5)" filter="url(#board-thread-shadow)"><path data-thread="shadow"/></g>
  <g class="thread-cord"><path data-thread="edge"/><path data-thread="body"/><path data-thread="fiber"/><path data-thread="twist"/></g>
  <g class="pin-knots"></g>
  <g class="board-pins"></g>
